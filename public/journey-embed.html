<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Raid Relic · Recorded journey replay</title>
    <link rel="stylesheet" href="/fonts.css" />
    <link rel="stylesheet" href="/journey-map.css" />
    <script type="module" src="/journey-map.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body class="journey-embed">
    <section id="journey-map" aria-labelledby="map-title">
      <h2 id="map-title">A constellation of Keepers</h2>
      <p>
        Recorded journey replay. Curves connect channels, not places; thicker paths carried larger
        raids.
      </p>
      <p id="map-status" role="status" aria-live="polite"></p>
      <svg
        id="map-svg"
        viewBox="0 0 900 440"
        role="group"
        aria-label="Recorded raids between configured Keepers"
      ></svg>
      <div class="map-controls">
        <button id="map-play" type="button" disabled>Replay journey</button
        ><button id="map-restart" type="button" disabled>Restart</button
        ><label for="map-range">Recorded stop</label
        ><input id="map-range" type="range" min="0" max="0" value="0" step="0.01" disabled /><output
          id="map-caption"
          for="map-range"
          >No recorded stops</output
        ><button id="map-refresh" type="button">Refresh map</button
        ><button id="map-share" type="button" disabled>Copy stop link</button>
      </div>
      <ol id="map-stops"></ol>
    </section>
  </body>
</html>
