<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raid Relic OBS overlay</title><link rel="stylesheet" href="/overlay.css"><script type="module" src="/overlay.js"></script></head>
<body><main class="relic-overlay" aria-label="Raid Relic idle overlay"><p class="simulator" id="simulator" hidden>Local simulator · test data</p><button id="sound-toggle" type="button" aria-label="Enable optional overlay sounds" aria-pressed="false" hidden>Sound</button><div class="archive"><div class="guide guide-a"></div><div class="guide guide-b"></div><div class="guide guide-c"></div><div id="rings" class="growth-rings" aria-hidden="true"></div><div id="runes" class="runes" aria-label="Approved mark runes"></div><svg id="claim-arcs" hidden viewBox="0 0 120 120" aria-hidden="true"><circle id="offer-arc" cx="60" cy="60" r="54"/><circle id="accept-arc" cx="60" cy="60" r="49"/></svg><img class="crystal" src="/crystal.svg" alt="Faceted silver and violet relic"></div><div id="claim-meter" role="status" hidden><span id="claim-label"></span></div><h1>Raid Relic</h1><p id="status" role="status" aria-live="polite">Connecting to relic state…</p><div class="charge-track" aria-hidden="true"><span id="charge"></span></div><p id="count">No current state</p><p class="lineage" id="lineage">0 growth rings · waiting for completed claims</p><p id="handoff" role="status"></p><p id="waiting-note" hidden>No active relic state for this channel. No arrival is shown until a verified raid; marks need an opted-in Keeper holding the relic.</p><div class="compact-state" aria-hidden="true"><span id="compact-status">Connecting…</span><span id="compact-count">No current state</span><span id="compact-handoff"></span></div></main></body></html>
